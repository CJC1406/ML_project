[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.optional-dependencies]
runtime = [
  "pandas>=2.0", "numpy>=1.24", "networkx>=3.2", "scipy>=1.11",
  "scikit-learn>=1.3", "shapely>=2.0", "geopandas>=0.14", "pyproj>=3.6",
  "folium>=0.15", "matplotlib>=3.8"
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
